# Reusable deep-review workflow. Callers: see templates/caller.yml.
# Runs an agent CLI (opencode) with GLM on the Z.AI coding plan against the checked-out PR
# head. The Actions runner is the sandbox: the agent may grep, read, and run tests.
name: deep-review
on:
  workflow_call:
    inputs:
      agent:
        description: agent CLI to run, opencode or pi
        type: string
        default: opencode
      model:
        description: model id; opencode uses zai-coding-plan/glm-5.3, pi uses zai/glm-5.3
        type: string
        default: ""
      variant:
        description: reasoning effort variant passed to opencode (empty = provider default)
        type: string
        default: ""
      timeout_minutes:
        type: number
        default: 25
    secrets:
      ZAI_API_KEY:
        required: true

env:
  OPENCODE_VERSION: "1.18.31"
  PI_VERSION: "0.85.1"
  AST_GREP_VERSION: "0.45.3"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  review:
    # Drafts are skipped by the caller; fork PRs get no secrets, so skip them here.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: deep-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout deep-review tooling
        uses: actions/checkout@v6
        with:
          repository: seanGSISG/deep-review
          path: .deep-review-tools
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install opencode, ast-grep, gitleaks
        run: |
          # opencode fetches its platform binary in a postinstall script, so it must not be installed with --ignore-scripts.
          npm install -g "opencode-ai@${OPENCODE_VERSION}" "@ast-grep/cli@${AST_GREP_VERSION}"
          npm install -g --ignore-scripts "@earendil-works/pi-coding-agent@${PI_VERSION}"
          opencode --version && pi --version && ast-grep --version
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          git clone --depth 1 https://github.com/coderabbitai/ast-grep-essentials "$RUNNER_TEMP/ast-grep-essentials"
          echo "AST_GREP_RULES=$RUNNER_TEMP/ast-grep-essentials" >> "$GITHUB_ENV"

      - name: Prepare review inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .deep-review/signal
          git diff "$BASE_SHA...HEAD" > .deep-review/diff.patch
          printf '# %s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > .deep-review/pr.md
          sed "s/{{BASE_SHA}}/$BASE_SHA/g" .deep-review-tools/prompts/review.md > .deep-review/prompt.md
          echo "diff: $(wc -l < .deep-review/diff.patch) lines, $(git diff --name-only "$BASE_SHA...HEAD" | wc -l) files"

      - name: Collect deterministic signal
        # Signal collection lives in the package now. Deliverable 3 installs the CLI and replaces
        # this step, and everything around it, with one `deep-review review --pr` call.
        run: uv run --project .deep-review-tools python -m deep_review.signal

      - name: Run deep review agent
        id: agent
        env:
          ZHIPU_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # The Reviewer must see only the review prompt, and here every instruction file within
          # reach comes from the branch under review: AGENTS.md, CLAUDE.md, CONTEXT.md and the
          # skills under .claude/skills. The first also stops a .opencode/ directory in that
          # branch starting an npm install inside the checkout. deep_review.reviewer is the
          # source of truth for both; this copy goes away with the step itself, in #9.
          OPENCODE_DISABLE_PROJECT_CONFIG: "1"
          OPENCODE_DISABLE_CLAUDE_CODE: "1"
          AGENT: ${{ inputs.agent }}
          MODEL_IN: ${{ inputs.model }}
          VARIANT: ${{ inputs.variant }}
          BUDGET: ${{ inputs.timeout_minutes }}
        run: |
          start=$(date +%s)
          # Prompt comes from a file, and stdin must be /dev/null: the agents read piped stdin as extra
          # input and block forever when stdin is an open socket or pipe.
          if [ "$AGENT" = pi ]; then
            MODEL=${MODEL_IN:-zai/glm-5.3}
            timeout $(( (BUDGET - 5) * 60 )) \
              pi -p --mode json --no-session --no-extensions --no-skills --no-prompt-templates \
                --no-context-files --no-approve \
                --model "$MODEL" --thinking "${VARIANT:-medium}" \
                "$(cat .deep-review/prompt.md)" < /dev/null > .deep-review/agent-events.jsonl 2> .deep-review/agent.err || echo "agent exit $?"
          else
            MODEL=${MODEL_IN:-zai-coding-plan/glm-5.3}
            VARIANT_FLAG=""; [ -n "$VARIANT" ] && VARIANT_FLAG="--variant $VARIANT"
            timeout $(( (BUDGET - 5) * 60 )) \
              opencode run --format json --pure --dangerously-skip-permissions \
                -m "$MODEL" $VARIANT_FLAG --title "deep-review #${{ github.event.pull_request.number }}" \
                "$(cat .deep-review/prompt.md)" < /dev/null > .deep-review/agent-events.jsonl 2> .deep-review/agent.err || echo "agent exit $?"
          fi
          echo "elapsed=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          echo "model=$AGENT:$MODEL" >> "$GITHUB_OUTPUT"
          ls -la .deep-review
          echo "--- agent stderr (tail)"; tail -n 20 .deep-review/agent.err || true

      - name: Post review
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL: ${{ steps.agent.outputs.model }}
          ELAPSED_SECONDS: ${{ steps.agent.outputs.elapsed }}
        run: uv run .deep-review-tools/scripts/post_review.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-review-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: .deep-review
          include-hidden-files: true # the directory itself is dot-prefixed
          retention-days: 14
