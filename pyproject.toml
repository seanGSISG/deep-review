[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-review"
version = "0.2.1"
description = "A second-opinion pull-request reviewer: a Reviewer of a different model family proves defects by execution and quotation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[project.scripts]
deep-review = "deep_review.cli:run"

[project.urls]
Homepage = "https://github.com/seanGSISG/deep-review"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.14", "ty>=0.0.1a21"]

[tool.hatch.build.targets.wheel]
packages = ["src/deep_review"]

# The review prompt and the Skill live at the repo root as their single source and are mapped
# into the wheel, where the CLI reads them back through importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"prompts/review.md" = "deep_review/_data/review.md"
"skills/pre-pr-review" = "deep_review/_data/skills/pre-pr-review"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# scripts/ holds the shell and PEP 723 implementations still being ported into the package.
exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live Run costs Z.AI credits, so `just test` leaves it out and `just test-live` asks for it.
addopts = "-q -m 'not integration'"
markers = ["integration: runs the real Reviewer against a planted bug and spends Z.AI credits"]
